<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Google Authenticator 迁移二维码合并器</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,sans-serif; margin:0; background:#f5f5f7; color:#111; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px 48px; }
  .card { background:white; border-radius:18px; padding:18px; box-shadow:0 8px 28px rgba(0,0,0,.07); margin-bottom:16px; }
  h1 { font-size:26px; margin:0 0 10px; }
  p { line-height:1.55; margin:8px 0; }
  .muted { color:#666; font-size:14px; }
  input[type=file] { width:100%; margin:10px 0 14px; }
  button { width:100%; padding:14px 16px; border:0; border-radius:14px; font-size:17px; font-weight:700; background:#0a84ff; color:white; }
  button:disabled { opacity:.45; }
  #status { white-space:pre-wrap; font-size:14px; margin-top:12px; }
  #qrwrap { display:none; text-align:center; }
  #qrcode { display:flex; justify-content:center; padding:16px 0; }
  canvas.qrout { max-width:100%; height:auto; image-rendering:pixelated; }
  .warn { background:#fff7e6; border:1px solid #ffd591; color:#7a4b00; border-radius:12px; padding:12px; font-size:14px; }
  .ok { color:#16803a; font-weight:600; }
  .err { color:#c62828; font-weight:600; }
  @media (prefers-color-scheme: dark) {
    body { background:#111214; color:#f5f5f7; }
    .card { background:#1c1c1e; }
    .muted { color:#aaa; }
    .warn { background:#332600; border-color:#8d6b00; color:#ffd978; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Google Authenticator 二维码合并器</h1>
    <p>选择 Google Authenticator 导出的 <b>3 张迁移二维码截图</b>。页面会在你的 iPhone 本地解析并尝试合并成 1 张。</p>
    <div class="warn">注意：二维码里包含你的 2FA 秘钥。不要把生成后的二维码发给别人，也不要上传到网盘或聊天软件。</div>
    <input id="files" type="file" accept="image/*" multiple>
    <button id="mergeBtn">识别并合并</button>
    <div id="status" class="muted"></div>
  </div>

  <div class="card" id="qrwrap">
    <h1 style="font-size:21px">合并后的二维码</h1>
    <div id="qrcode"></div>
    <p id="resultInfo" class="muted"></p>
    <button id="saveBtn">保存二维码到照片</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const statusEl = $('#status');

function log(msg, cls='') {
  statusEl.className = cls || 'muted';
  statusEl.textContent = msg;
}

function readVarint(buf, pos) {
  let val = 0, shift = 0, p = pos;
  while (p < buf.length) {
    const b = buf[p++];
    val += (b & 0x7f) * Math.pow(2, shift);
    if (!(b & 0x80)) return [val, p];
    shift += 7;
    if (shift > 56) throw new Error('varint 过长');
  }
  throw new Error('varint 截断');
}

function encVarint(n) {
  const out = [];
  n = Number(n);
  while (n >= 0x80) {
    out.push((n & 0x7f) | 0x80);
    n = Math.floor(n / 128);
  }
  out.push(n);
  return out;
}

function parseMigration(bytes) {
  let p = 0;
  const otpParams = [];
  let version = 1, batchSize = null, batchIndex = null, batchId = null;

  while (p < bytes.length) {
    let key; [key, p] = readVarint(bytes, p);
    const field = key >> 3, wire = key & 7;

    if (wire === 2) {
      let len; [len, p] = readVarint(bytes, p);
      const end = p + len;
      if (end > bytes.length) throw new Error('protobuf 数据截断');
      const chunk = bytes.slice(p, end);
      if (field === 1) otpParams.push(chunk);
      p = end;
    } else if (wire === 0) {
      let v; [v, p] = readVarint(bytes, p);
      if (field === 2) version = v;
      else if (field === 3) batchSize = v;
      else if (field === 4) batchIndex = v;
      else if (field === 5) batchId = v;
    } else if (wire === 1) {
      p += 8;
    } else if (wire === 5) {
      p += 4;
    } else {
      throw new Error('遇到不支持的 protobuf wire type: ' + wire);
    }
  }
  return { otpParams, version, batchSize, batchIndex, batchId };
}

function buildMigration(allOtp, version=1, batchId=1) {
  const out = [];
  for (const msg of allOtp) {
    out.push(...encVarint((1 << 3) | 2));
    out.push(...encVarint(msg.length));
    out.push(...msg);
  }
  out.push(...encVarint((2 << 3) | 0), ...encVarint(version));
  out.push(...encVarint((3 << 3) | 0), ...encVarint(1));
  out.push(...encVarint((4 << 3) | 0), ...encVarint(0));
  out.push(...encVarint((5 << 3) | 0), ...encVarint(batchId || 1));
  return new Uint8Array(out);
}

function b64ToBytes(s) {
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}
function bytesToB64(bytes) {
  let bin = '';
  const step = 0x8000;
  for (let i=0;i<bytes.length;i+=step) {
    bin += String.fromCharCode(...bytes.subarray(i, i+step));
  }
  return btoa(bin);
}

async function decodeImage(file) {
  const bmp = await createImageBitmap(file);
  const canvas = document.createElement('canvas');
  canvas.width = bmp.width; canvas.height = bmp.height;
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(bmp,0,0);
  const img = ctx.getImageData(0,0,canvas.width,canvas.height);
  const code = jsQR(img.data, img.width, img.height, {inversionAttempts:'attemptBoth'});
  if (!code) throw new Error(`无法识别：${file.name || '图片'}`);
  return code.data;
}

function migrationFromText(text) {
  if (!text.startsWith('otpauth-migration://offline?')) {
    throw new Error('识别到的不是 Google Authenticator 迁移二维码');
  }
  const u = new URL(text);
  const data = u.searchParams.get('data');
  if (!data) throw new Error('二维码缺少 data 参数');
  return parseMigration(b64ToBytes(decodeURIComponent(data)));
}

$('#mergeBtn').addEventListener('click', async () => {
  try {
    const files = [...$('#files').files];
    if (files.length < 2) throw new Error('请至少选择 2 张迁移二维码图片。');
    log(`正在识别 ${files.length} 张二维码…`);

    const parts = [];
    for (let i=0;i<files.length;i++) {
      log(`正在识别第 ${i+1}/${files.length} 张…`);
      const text = await decodeImage(files[i]);
      const payload = migrationFromText(text);
      parts.push(payload);
    }

    const ids = parts.map(x => x.batchId).filter(x => x != null);
    if (ids.length && !ids.every(x => x === ids[0])) {
      throw new Error('这些二维码似乎不是同一批导出，batch_id 不一致。');
    }

    const expected = parts.map(x => x.batchSize).filter(x => x != null);
    if (expected.length && !expected.every(x => x === expected[0])) {
      throw new Error('这些二维码的 batch_size 不一致。');
    }

    const indexed = parts.every(x => x.batchIndex != null);
    if (indexed) parts.sort((a,b) => a.batchIndex - b.batchIndex);

    const allOtp = parts.flatMap(x => x.otpParams);
    if (!allOtp.length) throw new Error('没有找到任何账号数据。');

    const merged = buildMigration(allOtp, parts[0].version || 1, ids[0] || 1);
    const uri = 'otpauth-migration://offline?data=' + encodeURIComponent(bytesToB64(merged));

    $('#qrcode').innerHTML = '';
    const canvas = document.createElement('canvas');
    canvas.className = 'qrout';
    $('#qrcode').appendChild(canvas);

    try {
      await QRCode.toCanvas(canvas, uri, {
        errorCorrectionLevel:'L',
        margin:4,
        width:900
      });
    } catch (e) {
      throw new Error('合并后的数据太大，单张二维码可能已超过可可靠生成/扫描的容量。建议继续使用原来的多张二维码。');
    }

    $('#resultInfo').textContent = `共合并 ${allOtp.length} 个账号。请先用另一台设备试扫确认成功，再删除旧数据。`;
    $('#qrwrap').style.display = 'block';
    log(`完成：识别 ${files.length} 张，共 ${allOtp.length} 个账号。`, 'ok');
    window._mergedCanvas = canvas;
  } catch (e) {
    $('#qrwrap').style.display = 'none';
    log('失败：' + (e && e.message ? e.message : e), 'err');
  }
});

$('#saveBtn').addEventListener('click', async () => {
  const canvas = window._mergedCanvas;
  if (!canvas) return;
  canvas.toBlob(async blob => {
    try {
      const file = new File([blob], 'google-authenticator-merged.png', {type:'image/png'});
      if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
        await navigator.share({files:[file], title:'Google Authenticator 合并二维码'});
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = file.name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      }
    } catch(e) {
      alert('保存失败，请长按二维码截图保存。');
    }
  }, 'image/png');
});
</script>
</body>
</html>
